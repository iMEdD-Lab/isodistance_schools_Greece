<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta
  name="viewport"
  content="width=device-width, initial-scale=1, viewport-fit=cover"
>
<title>Χάρτης αποστάσεων από κοντινότερη σχολική μονάδα</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"/>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }

#map-container {
  position: relative;
  width: 100%;
  height: min(600px, 80vh);
}

#map {
  width: 100%;
  height: 100%;
}
  
.info-popup h3 {
  margin: 0 0 8px;
  font-size: clamp(13px, 3.5vw, 15px);
}

.info-popup .row {
  display: flex;
  justify-content: space-between;
  gap: 14px;
  margin: 4px 0;
  font-size: clamp(12px, 3vw, 14px);
}

.info-popup .label {
  color: #666;
}

.info-popup .value {
  font-weight: 600;
  text-align: right;
}

#loading {
  color: #888;
  font-style: italic;
}

#top-left-controls {
  position: absolute;
  top: 10px;
  left: 10px;
  z-index: 1000;
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 8px;
  max-width: calc(100vw - 90px); /* leave room for #lang-switch on the right */
}

#instructions {
  padding: clamp(6px, 2vw, 8px) clamp(10px, 3vw, 14px);
  background: white;
  border-radius: 6px;
  box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
  font-size: clamp(11px, 3vw, 13px);
  color: #444;
}

#map-switch,
#lang-switch {
  padding: clamp(6px, 2vw, 8px) clamp(10px, 3vw, 14px);
  border: 0;
  border-radius: 6px;
  background: white;
  box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
  font-size: clamp(11px, 3vw, 13px);
  color: #444;
  cursor: pointer;
  white-space: nowrap;
}

#map-switch:hover,
#lang-switch:hover {
  background: #f3f3f3;
}

#lang-switch {
  position: absolute;
  top: 10px;
  right: 10px;
  z-index: 1000;
}

#legend {
  position: absolute;
  right: 10px;
  bottom: 58px;
  z-index: 1000;
  width: clamp(140px, 45vw, 190px);
  padding: clamp(8px, 2vw, 10px) clamp(9px, 2.5vw, 12px);
  background: rgba(255, 255, 255, 0.92);
  border-radius: 6px;
  box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
  color: #444;
  font-size: clamp(11px, 2.8vw, 13px);
  line-height: 1.35;
}

#legend h3 {
  margin: 0 0 7px;
  font-size: clamp(12px, 3vw, 14px);
}

#legend .legend-bar {
  display: flex;
  height: 14px;
  border-radius: 3px;
  overflow: hidden;
  border: 1px solid rgba(0, 0, 0, 0.2);
}

#legend .legend-bar span {
  flex: 1 1 0;
}

#legend .legend-ticks {
  position: relative;
  height: 16px;
  margin-top: 4px;
  font-size: clamp(10px, 2.5vw, 11px);
  color: #666;
}

#legend .legend-ticks .tick {
  position: absolute;
  transform: translateX(-50%);
}

#legend .legend-ticks .tick-5 {
  left: 25%;
}

#legend .legend-ticks .tick-10 {
  left: 50%;
}

#legend .legend-ticks .tick-25 {
  left: 75%;
}

#attribution {
  position: absolute;
  right: 10px;
  bottom: 10px;
  z-index: 1000;
  padding: 4px 7px;
  background: rgba(255, 255, 255, 0.88);
  border-radius: 4px;
  font-size: clamp(9px, 2.3vw, 11px);
  line-height: 1.3;
  color: #555;
}

#attribution a {
  color: #356a9a;
  text-decoration: none;
}

#attribution a:hover {
  text-decoration: underline;
}

/* Add your logo file to the same GitHub repository folder as index.html. */
#logo {
  position: absolute;
  bottom: 10px;
  left: 6px;
  z-index: 1000;
  display: flex;
  align-items: center;
  padding: 6px 8px;
  background: rgba(255, 255, 255, 0.9);
  border-radius: 6px;
  box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
}

#logo img {
  display: block;
  max-width: clamp(90px, 25vw, 150px);
  max-height: 70px;
  width: auto;
  height: auto;
}
  .leaflet-bottom.leaflet-left {
  bottom: 88px;
  left: 10px;
  }

  .leaflet-control-zoom a {
  width: 32px;
  height: 32px;
  line-height: 32px;
  font-size: 20px;
  }


@media (max-width: 480px) {
  #map-container {
    height: 100dvh;
    min-height: 420px;
  }

  #top-left-controls {
    top: max(8px, env(safe-area-inset-top, 0px));
    left: max(8px, env(safe-area-inset-left, 0px));
  }
  
  #lang-switch {
    top: max(8px, env(safe-area-inset-top, 0px));
    right: max(8px, env(safe-area-inset-right, 0px));
  }

  #legend {
    right: max(8px, env(safe-area-inset-right, 0px));
    bottom: calc(48px + env(safe-area-inset-bottom, 0px));
    width: clamp(140px, 48vw, 180px);
  }

  #attribution {
    right: max(8px, env(safe-area-inset-right, 0px));
    bottom: max(8px, env(safe-area-inset-bottom, 0px));
    max-width: calc(100vw - 16px);
    text-align: right;
  }

  #logo {
    left: max(4px, env(safe-area-inset-left, 0px));
    bottom: max(8px, env(safe-area-inset-bottom, 0px));
  }

  .leaflet-bottom.leaflet-left {
    bottom: calc(72px + env(safe-area-inset-bottom, 0px));
    left: max(8px, env(safe-area-inset-left, 0px));
  }
}
  
</style>
</head>
<body>

<div id="map-container">
  <div id="map"></div>

  <div id="top-left-controls">
    <div id="instructions">Κάντε κλικ για να εντοπίσετε το κοντινότερο σχολείο</div>
    <button id="map-switch">Χάρτης Γυμνασίων</button>
  </div>
  <button id="lang-switch">EN</button>

  <div id="legend" aria-label="Accessibility zone legend">
    <h3 id="legend-title">Ζώνη απόστασης (χλμ)</h3>

    <div class="legend-bar">
      <span style="background: #2166ac;"></span>
      <span style="background: #74add1;"></span>
      <span style="background: #fdae61;"></span>
      <span style="background: #d73027;"></span>
    </div>

    <div class="legend-ticks">
      <span class="tick tick-5">5</span>
      <span class="tick tick-10">10</span>
      <span class="tick tick-25">25+</span>
    </div>
  </div>

  <div id="attribution">
    ©
    <a
      href="https://www.openstreetmap.org/copyright"
      target="_blank"
      rel="noopener noreferrer"
    >OpenStreetMap contributors</a>
    · <span id="attribution-routing-label">Routing</span>:
    <a
      href="https://project-osrm.org/"
      target="_blank"
      rel="noopener noreferrer"
    >OSRM</a>
  </div>

  <div id="logo">
    <a
      href="https://lab.imedd.org/"
      target="_blank"
      rel="noopener noreferrer"
      aria-label="Visit the iMEdD website"
    >
      <img
        src="./imedd-logo.svg"
        alt="Project logo"
      >
    </a>
  </div>
</div>
  
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>

<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<link
  href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css"
  rel="stylesheet"
/>
<script src="https://unpkg.com/@maplibre/maplibre-gl-leaflet@0.0.22/leaflet-maplibre-gl.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Turf.js/6.5.0/turf.min.js"></script>

  
<script>

// ── Different language texts 
const STRINGS = {
  el: {
    title: "Χάρτης αποστάσεων από κοντινότερη σχολική μονάδα",
    loadingData: "Φόρτωση δεδομένων…",
    instructionsWithMap: label => `<strong>${label}</strong> — Κάντε κλικ για να εντοπίσετε το κοντινότερο σχολείο`,
    mapSwitchTo: { lykeia: "Χάρτης Λυκείων", gymnasia: "Χάρτης Γυμνασίων" },
    mapLabel: { lykeia: "Λύκεια", gymnasia: "Γυμνάσια" },
    legendTitle: "Ζώνη απόστασης (χλμ)",
    attributionRouting: "Δρομολόγηση",
    bandLabels: {
      1: "0–5 χλμ",
      2: "5–10 χλμ",
      3: "10–25 χλμ",
      4: "25–50+ χλμ ή δυσπρόσιτο"
    },
    outsideTitle: "Εκτός περιοχής ανάλυσης",
    accessibilityLabel: "Προσβασιμότητα",
    noCategoryValue: "Χωρίς κατηγορία απόστασης",
    loading: "Υπολογισμός απόστασης…",
    distanceLabel: "Απόσταση",
    zoneLabel: "Ζώνη απόστασης",
    errorTitle: "Ταξινόμηση προσβασιμότητας",
    routingLabel: "Δρομολόγηση",
    noRoute: "Δεν βρέθηκε διαδρομή",
    loadError: (url, status) => `Αποτυχία φόρτωσης ${url} (HTTP ${status}).`
  },
  en: {
    title: "Map of distances to the nearest school",
    loadingData: "Loading data…",
    instructionsWithMap: label => `<strong>${label}</strong> — Click to find the nearest school`,
    mapSwitchTo: { lykeia: "Lykeia Map", gymnasia: "Gymnasia Map" },
    mapLabel: { lykeia: "Lykeia", gymnasia: "Gymnasia" },
    legendTitle: "Distance zone (km)",
    attributionRouting: "Routing",
    bandLabels: {
      1: "0–5 km",
      2: "5–10 km",
      3: "10–25 km",
      4: "25–50+ km or hard to reach"
    },
    outsideTitle: "Outside analysis area",
    accessibilityLabel: "Accessibility",
    noCategoryValue: "No distance category",
    loading: "Calculating distance…",
    distanceLabel: "Distance",
    zoneLabel: "Distance zone",
    errorTitle: "Accessibility classification",
    routingLabel: "Routing",
    noRoute: "No route found",
    loadError: (url, status) => `Could not load ${url} (HTTP ${status}).`
  }
};

let activeLang = "el";

function t() {
  return STRINGS[activeLang];
}

// ── Data files ─────────────────────────────
const MAPS = {
  lykeia: {
    isodistancesUrl: "./geojson_files/lykeia-isodistances.geojson",
    pointsUrl: "./geojson_files/lykeia_locations.geojson"
  },
  gymnasia: {
    isodistancesUrl: "./geojson_files/gymnasia-isodistances.geojson",
    pointsUrl: "./geojson_files/gymnasia_locations.geojson"
  }
};

let activeMapKey = "lykeia";

// Change this only if the polygon field is named differently in the GeoJSON.
const CATEGORY_FIELD = "category";

// Change these only if your Lykeia GeoJSON uses a known different name field.
const SCHOOL_NAME_FIELDS = [
  "name",
  "NAME",
  "school_name",
  "SCHOOL_NAME",
  "onoma",
  "ΟΝΟΜΑ"
];

const OSRM_BASE = "https://router.project-osrm.org";

// Colors are language-independent; labels come from STRINGS.bandLabels.
const BAND_COLORS = {
  1: "#2166ac",
  2: "#74add1",
  3: "#fdae61",
  4: "#d73027"
};

const SCHOOL_COLOR = "#5b2c6f";
const routeCache = {};

let DATA = {
  isodistances: null,
  lykeia: null
};

let bandsLayer = null;
let schoolsLayer = null;
let islandsNoSchoolLayer = null;

// ── Map setup ───────────────────────────────────────────────────────────────
const map = L.map("map", {
  zoomControl: false
}).setView([38.0, 23.7], 8);

L.control.zoom({
  position: "bottomleft"
}).addTo(map);

window.addEventListener("resize", () => {
  map.invalidateSize({ pan: false });
});

L.maplibreGL({
  style: "https://tiles.openfreemap.org/styles/positron"
}).addTo(map);

let userMarker = null;
let routeLayer = null;
let lastPopupRender = null; // re-run on language toggle to update an open popup

// ── Static UI text (title, buttons, legend, attribution) ───────────────────
function updateStaticUI() {
  const strings = t();

  document.title = strings.title;
  document.getElementById("legend-title").textContent = strings.legendTitle;
  document.getElementById("attribution-routing-label").textContent = strings.attributionRouting;

  document.getElementById("map-switch").textContent =
    strings.mapSwitchTo[activeMapKey === "lykeia" ? "gymnasia" : "lykeia"];

  document.getElementById("lang-switch").textContent =
    activeLang === "el" ? "EN" : "ΕΛ";

  if (DATA.isodistances) {
    document.getElementById("instructions").innerHTML =
      strings.instructionsWithMap(strings.mapLabel[activeMapKey]);
  }
}

document.getElementById("lang-switch").addEventListener("click", () => {
  activeLang = activeLang === "el" ? "en" : "el";
  updateStaticUI();

  if (lastPopupRender) {
    lastPopupRender();
  }
});

// ── Data loading ────────────────────────────────────────────────────────────
async function loadMapData(mapKey) {
  const config = MAPS[mapKey];

  document.getElementById("instructions").textContent = t().loadingData;

  if (bandsLayer) {
    map.removeLayer(bandsLayer);
    bandsLayer = null;
  }

  if (schoolsLayer) {
    map.removeLayer(schoolsLayer);
    schoolsLayer = null;
  }

  if (routeLayer) {
    map.removeLayer(routeLayer);
    routeLayer = null;
  }

  if (userMarker) {
    map.removeLayer(userMarker);
    userMarker = null;
  }

  lastPopupRender = null;

  try {
    const [isodistances, lykeia] = await Promise.all([
      fetch(config.isodistancesUrl).then(response => {
        if (!response.ok) {
          throw new Error(t().loadError(config.isodistancesUrl, response.status));
        }
        return response.json();
      }),

      fetch(config.pointsUrl).then(response => {
        if (!response.ok) {
          throw new Error(t().loadError(config.pointsUrl, response.status));
        }
        return response.json();
      })
    ]);

    DATA.isodistances = isodistances;
    DATA.lykeia = lykeia;

    renderBands();
    renderLykeia();

    updateStaticUI();
  } catch (error) {
    document.getElementById("instructions").textContent = error.message;
    console.error(error);
  }
}

updateStaticUI();
loadMapData(activeMapKey);

// ── Load islands without schools once ───────────────────────────────────────
fetch("./geojson_files/islands-without-schools.geojson")
  .then(response => {
    if (!response.ok) {
      throw new Error(t().loadError("./geojson_files/islands-without-schools.geojson", response.status));
    }
    return response.json();
  })
  .then(geojson => {
    renderIslandsNoSchoolLayer(geojson);
  })
  .catch(error => {
    console.error("Could not load the islands_without_schools layer:", error);
  });

// ── Accessibility polygons ──────────────────────────────────────────────────
function renderBands() {
  bandsLayer = L.geoJSON(DATA.isodistances, {
    interactive: false,

    style: feature => {
      const category = Number(feature.properties?.[CATEGORY_FIELD]);
      const color = BAND_COLORS[category] || "#999";

      return {
        color: color,
        weight: 1,
        fillColor: color,
        fillOpacity: 0.35
      };
    }
  }).addTo(map);
}

// ── Islands without schools: display-only polygon overlay ───────────────────
function renderIslandsNoSchoolLayer(geojson) {
  if (islandsNoSchoolLayer) {
    map.removeLayer(islandsNoSchoolLayer);
  }

  islandsNoSchoolLayer = L.geoJSON(geojson, {
    interactive: false,
    style: {
      color: "#7A7574",
      weight: 1,
      opacity: 1,
      fillColor: "#7A7574",
      fillOpacity: 0.35
    }
  }).addTo(map);
}

// ── School helpers ──────────────────────────────────────────────────────────
function getSchoolName(feature) {
  const properties = feature.properties || {};

  for (const field of SCHOOL_NAME_FIELDS) {
    if (properties[field]) {
      return String(properties[field]);
    }
  }

  return "Lykeio";
}

function getSchoolPointFeatures() {
  return DATA.lykeia.features.filter(feature =>
    feature.geometry &&
    feature.geometry.type === "Point" &&
    Array.isArray(feature.geometry.coordinates) &&
    feature.geometry.coordinates.length >= 2
  );
}

// ── Render Lykeia points ────────────────────────────────────────────────────
function renderLykeia() {
  schoolsLayer = L.geoJSON(DATA.lykeia, {
    pointToLayer: (feature, latlng) => L.circleMarker(latlng, {
      radius: getSchoolPointRadius(map.getZoom()),
      color: "white",
      weight: 1.5,
      fillColor: SCHOOL_COLOR,
      fillOpacity: 1
    }),

    onEachFeature: (feature, layer) => {
      layer.bindTooltip(getSchoolName(feature), { sticky: true });
    }
  }).addTo(map);

  updateSchoolPointSizes();

  if (activeMapKey === "lykeia") {
    const bounds = schoolsLayer.getBounds();

    if (bounds.isValid()) {
      map.fitBounds(bounds, {
        padding: [20, 20],
        maxZoom: 8
      });
    }
  }
}

// ── School-point size by zoom level ─────────────────────────────────────────
function getSchoolPointRadius(zoom) {
  if (zoom <= 7) return 1.5;
  if (zoom <= 8) return 2;
  if (zoom <= 9) return 3;
  if (zoom <= 10) return 4;
  return 5;
}

function updateSchoolPointSizes() {
  if (!schoolsLayer) {
    return;
  }

  const radius = getSchoolPointRadius(map.getZoom());

  schoolsLayer.eachLayer(layer => {
    if (layer instanceof L.CircleMarker) {
      layer.setRadius(radius);
      layer.setStyle({
        weight: radius <= 2 ? 0.75 : 1.5
      });
    }
  });
}

map.on("zoomend", updateSchoolPointSizes);

// ── Accessibility lookup ────────────────────────────────────────────────────
function getCategoryForPoint(lat, lon) {
  const point = turf.point([lon, lat]);

  for (const feature of DATA.isodistances.features) {
    if (turf.booleanPointInPolygon(point, feature)) {
      return Number(feature.properties?.[CATEGORY_FIELD]);
    }
  }

  return null;
}

// ── OSRM route request ──────────────────────────────────────────────────────
async function getRoute(startLat, startLon, endLat, endLon) {
  const key =
    `${activeMapKey}:` +
    `${startLat.toFixed(4)},${startLon.toFixed(4)}` +
    `-${endLat.toFixed(4)},${endLon.toFixed(4)}`;

  if (routeCache[key]) {
    return routeCache[key];
  }

  const url =
    `${OSRM_BASE}/route/v1/driving/` +
    `${startLon},${startLat};${endLon},${endLat}` +
    `?overview=full&geometries=geojson`;

  const response = await fetch(url);

  if (!response.ok) {
    throw new Error(`Routing service unavailable (HTTP ${response.status}).`);
  }

  const json = await response.json();

  if (json.code !== "Ok" || !json.routes || json.routes.length === 0) {
    throw new Error(json.message || "No driving route was found to this school.");
  }

  const route = json.routes[0];

  const result = {
    distKm: route.distance / 1000,
    durMin: route.duration / 60,
    geojson: route.geometry
  };

  routeCache[key] = result;
  return result;
}

// ── Find nearest school by road ─────────────────────────────────────────────
async function findNearestSchoolByRoad(lat, lon) {
  const schoolFeatures = getSchoolPointFeatures();

  if (schoolFeatures.length === 0) {
    throw new Error("No valid Point features were found in lykeia_points.geojson.");
  }

  const clickedPoint = turf.point([lon, lat]);

  const rankedByStraightLineDistance = schoolFeatures
    .map(feature => ({
      feature,
      straightLineKm: turf.distance(clickedPoint, feature, {
        units: "kilometers"
      })
    }))
    .sort((a, b) => a.straightLineKm - b.straightLineKm);

  const candidates = rankedByStraightLineDistance.slice(0, 5);

  const attempts = await Promise.allSettled(
    candidates.map(async candidate => {
      const [schoolLon, schoolLat] = candidate.feature.geometry.coordinates;
      const route = await getRoute(lat, lon, schoolLat, schoolLon);

      return {
        feature: candidate.feature,
        name: getSchoolName(candidate.feature),
        ...route
      };
    })
  );

  const routeResults = attempts
    .filter(attempt => attempt.status === "fulfilled")
    .map(attempt => attempt.value)
    .sort((a, b) => a.distKm - b.distKm);

  if (routeResults.length === 0) {
    throw new Error("No driving route was found to any nearby school.");
  }

  return routeResults[0];
}

// ── Main click handler ──────────────────────────────────────────────────────
map.on("click", async event => {
  if (!DATA.isodistances || !DATA.lykeia) {
    return;
  }

  const { lat, lng } = event.latlng;
  const category = getCategoryForPoint(lat, lng);

  if (routeLayer) {
    map.removeLayer(routeLayer);
    routeLayer = null;
  }

  if (userMarker) {
    map.removeLayer(userMarker);
  }

  userMarker = L.marker([lat, lng]).addTo(map);

  // Outside every isodistance polygon: do not call OSRM and do not identify a school.
  if (category === null || !BAND_COLORS[category]) {
  lastPopupRender = () => {
    userMarker.setPopupContent(`
      <div class="info-popup">
        <h3>${t().outsideTitle}</h3>
      </div>
    `);
  };

  userMarker.bindPopup("", { className: "info-popup" }).openPopup();
  lastPopupRender();
  return;
}

  lastPopupRender = () => {
    userMarker.setPopupContent(
      `<div class="info-popup"><div id="loading">${t().loading}</div></div>`
    );
  };

  userMarker.bindPopup("", { className: "info-popup" }).openPopup();
  lastPopupRender();

  try {
    const nearest = await findNearestSchoolByRoad(lat, lng);

    routeLayer = L.geoJSON(nearest.geojson, {
      style: {
        color: "#27ae60",
        weight: 4,
        opacity: 0.85
      }
    }).addTo(map);

    lastPopupRender = () => {
      const strings = t();
      const categoryLabel = strings.bandLabels[category];

      userMarker.setPopupContent(`
        <div class="info-popup">
          <h3>${nearest.name}</h3>

          <div class="row">
            <span class="label">${strings.distanceLabel}</span>
            <span class="value">${nearest.distKm.toFixed(1)} ${activeLang === "el" ? "χλμ" : "km"}</span>
          </div>

        </div>
      `);
    };
    lastPopupRender();
  } catch (error) {
    console.error(error);

    lastPopupRender = () => {
      const strings = t();
      const categoryLabel = strings.bandLabels[category];

      userMarker.setPopupContent(`
        <div class="info-popup">
          <h3>${strings.errorTitle}</h3>

          <div class="row">
            <span class="label">${strings.routingLabel}</span>
            <span class="value">${strings.noRoute}</span>
          </div>
        </div>
      `);
    };
    lastPopupRender();
  }
});

document.getElementById("map-switch").addEventListener("click", () => {
  activeMapKey = activeMapKey === "lykeia" ? "gymnasia" : "lykeia";
  loadMapData(activeMapKey);
});
