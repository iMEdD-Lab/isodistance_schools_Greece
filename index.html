<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta
  name="viewport"
  content="width=device-width, initial-scale=1, viewport-fit=cover"
>
<title>Χάρτης αποστάσεων από κοντινότερη σχολική μονάδα</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"/>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }

  #map {
    width: 100%;
    height: 600px;
  }

  #panel {
    position: absolute;
    top: 10px;
    right: 10px;
    z-index: 1000;
    display: none;
    max-width: 280px;
    padding: 14px 16px;
    background: white;
    border-radius: 8px;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
    font-size: 14px;
  }

  #panel h3 {
    margin: 0 0 8px;
    font-size: 15px;
  }

  #panel .row {
    display: flex;
    justify-content: space-between;
    gap: 14px;
    margin: 4px 0;
  }

  #panel .label {
    color: #666;
  }

  #panel .value {
    font-weight: 600;
    text-align: right;
  }

  #loading {
    color: #888;
    font-style: italic;
  }

  #instructions {
    position: absolute;
    top: 10px;
    left: 50px;
    z-index: 1000;
    padding: 8px 14px;
    background: white;
    border-radius: 6px;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
    font-size: 13px;
    color: #444;
  }
  
  #map-switch {
  position: absolute;
  top: 48px;
  left: 50px;
  z-index: 1000;
  padding: 8px 14px;
  border: 0;
  border-radius: 6px;
  background: white;
  box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
  font-size: 13px;
  color: #444;
  cursor: pointer;
  }

  #map-switch:hover {
  background: #f3f3f3;
  }

  #legend {
  position: absolute;
  right: 10px;
  bottom: 24px;
  z-index: 1000;
  min-width: 190px;
  padding: 10px 12px;
  background: rgba(255, 255, 255, 0.92);
  border-radius: 6px;
  box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
  color: #444;
  font-size: 13px;
  line-height: 1.35;
  }

  #legend h3 {
    margin: 0 0 7px;
    font-size: 14px;
  }

  #legend .legend-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin: 4px 0;
  }

  #legend .swatch {
    width: 15px;
    height: 15px;
    flex: 0 0 15px;
    border: 1px solid rgba(0, 0, 0, 0.2);
    border-radius: 2px;
  }

  #attribution {
    position: absolute;
    right: 10px;
    bottom: 10px;
    z-index: 1000;
    padding: 4px 7px;
    background: rgba(255, 255, 255, 0.88);
    border-radius: 4px;
    font-size: 11px;
    line-height: 1.3;
    color: #555;
  }

  #attribution a {
    color: #356a9a;
    text-decoration: none;
  }

  #attribution a:hover {
    text-decoration: underline;
  }

  /* Add your logo file to the same GitHub repository folder as index.html. */
  #logo {
    position: absolute;
    bottom: 24px;
    left: 12px;
    z-index: 1000;
    display: flex;
    align-items: center;
    padding: 6px 8px;
    background: rgba(255, 255, 255, 0.9);
    border-radius: 6px;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
  }

  #logo img {
    display: block;
    max-width: 150px;
    max-height: 70px;
    width: auto;
    height: auto;
  }
</style>
</head>
<body>

<div id="map"></div>
<div id="instructions">Κάντε κλικ για να εντοπίσετε το κοντινότερο σχολείο</div>
<button id="map-switch">Χάρτης Γυμνασίων</button>

<div id="panel"></div>

<div id="legend" aria-label="Accessibility zone legend">
  <h3>Ζώνη απόστασης</h3>

  <div class="legend-row">
    <span class="swatch" style="background: #2166ac;"></span>
    <span>0–5 χλμ</span>
  </div>

  <div class="legend-row">
    <span class="swatch" style="background: #74add1;"></span>
    <span>5–10 χλμ</span>
  </div>

  <div class="legend-row">
    <span class="swatch" style="background: #fdae61;"></span>
    <span>10–25 χλμ</span>
  </div>

  <div class="legend-row">
    <span class="swatch" style="background: #d73027;"></span>
    <span>25–50+ χλμ ή δυσπρόσιτο σημείο</span>
  </div>
</div>

<div id="attribution">
  © <a
    href="https://www.openstreetmap.org/copyright"
    target="_blank"
    rel="noopener noreferrer"
  >OpenStreetMap contributors</a>
  · Routing:
  <a
    href="https://project-osrm.org/"
    target="_blank"
    rel="noopener noreferrer"
  >OSRM</a>
</div>


<!-- Upload logo.png to the repository root, or change logo.png to your logo filename. -->
<div id="logo">
  <a
    href="https://lab.imedd.org/"
    target="_blank"
    rel="noopener noreferrer"
    aria-label="Visit the iMEdD website"
  >
    <img
      src="./imedd-logo.svg"
      alt="Project logo"
    >
  </a>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>

<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<link
  href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css"
  rel="stylesheet"
/>
<script src="https://unpkg.com/@maplibre/maplibre-gl-leaflet@0.0.22/leaflet-maplibre-gl.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Turf.js/6.5.0/turf.min.js"></script>

  
<script>

// ── Data files (add new gymnasia isodistanes) ─────────────────────────────────────────────
const MAPS = {
  lykeia: {
    isodistancesUrl: "./lykeia-corrections.geojson",
    pointsUrl: "./lykeia_points.geojson",
    label: "Λύκεια"
  },
  gymnasia: {
    isodistancesUrl: "./gymnasia-corrections.geojson",
    pointsUrl: "./gymnasia_points.geojson",
    label: "Γυμνάσια"
  }
};

let activeMapKey = "lykeia";
  
// Change this only if the polygon field is named differently in the GeoJSON.
const CATEGORY_FIELD = "category";

// Change these only if your Lykeia GeoJSON uses a known different name field.
const SCHOOL_NAME_FIELDS = [
  "name",
  "NAME",
  "school_name",
  "SCHOOL_NAME",
  "onoma",
  "ΟΝΟΜΑ"
];

const OSRM_BASE = "https://router.project-osrm.org";
const FUEL_PRICE = 1.92;  // €/litre
const CONSUMPTION = 7.5;  // litres/100 km

const BAND_INFO = {
  1: { label: "0–5 χλμ", color: "#2166ac" },
  2: { label: "5–10 χλμ", color: "#74add1" },
  3: { label: "10–25 χλμ", color: "#fdae61" },
  4: { label: "25–50+ χλμ ή δυσπρόσιτο", color: "#d73027" }
};

const SCHOOL_COLOR = "#5b2c6f";
const routeCache = {};

let DATA = {
  isodistances: null,
  lykeia: null
};

let bandsLayer = null;
let schoolsLayer = null;
// ── Map setup ───────────────────────────────────────────────────────────────
const map = L.map("map").setView([38.0, 23.7], 8);

L.maplibreGL({
  style: "https://tiles.openfreemap.org/styles/positron"
}).addTo(map);

let userMarker = null;
let routeLayer = null;

// ── Data loading ────────────────────────────────────────────────────────────
async function loadMapData(mapKey) {
  const config = MAPS[mapKey];

  document.getElementById("instructions").textContent = "Φόρτωση δεδομένων…";

  if (bandsLayer) {
    map.removeLayer(bandsLayer);
    bandsLayer = null;
  }

  if (schoolsLayer) {
    map.removeLayer(schoolsLayer);
    schoolsLayer = null;
  }

  if (routeLayer) {
    map.removeLayer(routeLayer);
    routeLayer = null;
  }

  if (userMarker) {
    map.removeLayer(userMarker);
    userMarker = null;
  }

  document.getElementById("panel").style.display = "none";

  try {
    const [isodistances, lykeia] = await Promise.all([
      fetch(config.isodistancesUrl).then(response => {
        if (!response.ok) {
          throw new Error(
            `Could not load ${config.isodistancesUrl} (HTTP ${response.status}).`
          );
        }
        return response.json();
      }),

      fetch(config.pointsUrl).then(response => {
        if (!response.ok) {
          throw new Error(
            `Could not load ${config.pointsUrl} (HTTP ${response.status}).`
          );
        }
        return response.json();
      })
    ]);

    DATA.isodistances = isodistances;
    DATA.lykeia = lykeia;

    renderBands();
    renderLykeia();

    document.getElementById("instructions").textContent =
      `Κάντε κλικ για να εντοπίσετε το κοντινότερο σχολείο — ${config.label}`;
  } catch (error) {
    document.getElementById("instructions").textContent = error.message;
    console.error(error);
  }
}

loadMapData(activeMapKey);

// ── Accessibility polygons ──────────────────────────────────────────────────
// ── Accessibility polygons ──────────────────────────────────────────────────
function renderBands() {
  bandsLayer = L.geoJSON(DATA.isodistances, {
    // Let clicks pass through polygons to the map click handler.
    // This also prevents polygon hover/click interaction.
    interactive: false,

    style: feature => {
      const category = Number(feature.properties?.[CATEGORY_FIELD]);
      const info = BAND_INFO[category] || {
        label: "Unknown category",
        color: "#999"
      };

      return {
        color: info.color,
        weight: 1,
        fillColor: info.color,
        fillOpacity: 0.35
      };
    }
  }).addTo(map);
}
  
// ── School helpers ──────────────────────────────────────────────────────────
function getSchoolName(feature) {
  const properties = feature.properties || {};

  for (const field of SCHOOL_NAME_FIELDS) {
    if (properties[field]) {
      return String(properties[field]);
    }
  }

  return "Lykeio";
}

function getSchoolPointFeatures() {
  return DATA.lykeia.features.filter(feature =>
    feature.geometry &&
    feature.geometry.type === "Point" &&
    Array.isArray(feature.geometry.coordinates) &&
    feature.geometry.coordinates.length >= 2
  );
}

// ── Render Lykeia points ────────────────────────────────────────────────────
function renderLykeia() {
  schoolsLayer = L.geoJSON(DATA.lykeia, {
    pointToLayer: (feature, latlng) => L.circleMarker(latlng, {
      radius: getSchoolPointRadius(map.getZoom()),
      color: "white",
      weight: 1.5,
      fillColor: SCHOOL_COLOR,
      fillOpacity: 1
    }),

    onEachFeature: (feature, layer) => {
      layer.bindTooltip(getSchoolName(feature), { sticky: true });
    }
  }).addTo(map);

  // Apply the correct marker size immediately on first render,
  // rather than waiting for the first zoom event.
  updateSchoolPointSizes();

  // On the first load only, fit the map to all available school points.
  if (activeMapKey === "lykeia") {
    const bounds = schoolsLayer.getBounds();

    if (bounds.isValid()) {
      map.fitBounds(bounds, {
        padding: [20, 20],
        maxZoom: 8
      });
    }
  }
}

// ── School-point size by zoom level ─────────────────────────────────────────
function getSchoolPointRadius(zoom) {
  if (zoom <= 7) return 1.5;
  if (zoom <= 8) return 2;
  if (zoom <= 9) return 3;
  if (zoom <= 10) return 4;
  return 5;
}

function updateSchoolPointSizes() {
  if (!schoolsLayer) {
    return;
  }

  const radius = getSchoolPointRadius(map.getZoom());

  schoolsLayer.eachLayer(layer => {
    if (layer instanceof L.CircleMarker) {
      layer.setRadius(radius);

      layer.setStyle({
        weight: radius <= 2 ? 0.75 : 1.5
      });
    }
  });
}

map.on("zoomend", updateSchoolPointSizes);
  
// ── Accessibility lookup ────────────────────────────────────────────────────
function getCategoryForPoint(lat, lon) {
  const point = turf.point([lon, lat]);

  for (const feature of DATA.isodistances.features) {
    if (turf.booleanPointInPolygon(point, feature)) {
      return Number(feature.properties?.[CATEGORY_FIELD]);
    }
  }

  return null;
}

// ── Fuel cost ───────────────────────────────────────────────────────────────
function fuelCost(km) {
  return ((km / 100) * CONSUMPTION * FUEL_PRICE).toFixed(2);
}

// ── OSRM route request ──────────────────────────────────────────────────────
async function getRoute(startLat, startLon, endLat, endLon) {
  const key =
    `${activeMapKey}:` +
    `${startLat.toFixed(4)},${startLon.toFixed(4)}` +
    `-${endLat.toFixed(4)},${endLon.toFixed(4)}`;

  if (routeCache[key]) {
    return routeCache[key];
  }

  const url =
    `${OSRM_BASE}/route/v1/driving/` +
    `${startLon},${startLat};${endLon},${endLat}` +
    `?overview=full&geometries=geojson`;

  const response = await fetch(url);

  if (!response.ok) {
    throw new Error(`Routing service unavailable (HTTP ${response.status}).`);
  }

  const json = await response.json();

  if (json.code !== "Ok" || !json.routes || json.routes.length === 0) {
    throw new Error(json.message || "No driving route was found to this school.");
  }

  const route = json.routes[0];

  const result = {
    distKm: route.distance / 1000,
    durMin: route.duration / 60,
    geojson: route.geometry
  };

  routeCache[key] = result;
  return result;
}
  
// ── Find nearest school by road ─────────────────────────────────────────────
// First find the 5 geographically closest schools with Turf.
// Then ask OSRM for a driving route to each and choose the shortest road route.
async function findNearestSchoolByRoad(lat, lon) {
  const schoolFeatures = getSchoolPointFeatures();

  if (schoolFeatures.length === 0) {
    throw new Error("No valid Point features were found in lykeia_points.geojson.");
  }

  const clickedPoint = turf.point([lon, lat]);

  const rankedByStraightLineDistance = schoolFeatures
    .map(feature => ({
      feature,
      straightLineKm: turf.distance(clickedPoint, feature, {
        units: "kilometers"
      })
    }))
    .sort((a, b) => a.straightLineKm - b.straightLineKm);

  const candidates = rankedByStraightLineDistance.slice(0, 5);

const attempts = await Promise.allSettled(
  candidates.map(async candidate => {
    const [schoolLon, schoolLat] = candidate.feature.geometry.coordinates;
    const route = await getRoute(lat, lon, schoolLat, schoolLon);

    return {
      feature: candidate.feature,
      name: getSchoolName(candidate.feature),
      ...route
    };
  })
);

const routeResults = attempts
  .filter(attempt => attempt.status === "fulfilled")
  .map(attempt => attempt.value)
  .sort((a, b) => a.distKm - b.distKm);

if (routeResults.length === 0) {
  throw new Error("No driving route was found to any nearby school.");
}

return routeResults[0];
}
// ── Main click handler ──────────────────────────────────────────────────────
map.on("click", async event => {
  if (!DATA.isodistances || !DATA.lykeia) {
    return;
  }

  const { lat, lng } = event.latlng;
  const panel = document.getElementById("panel");
  const category = getCategoryForPoint(lat, lng);

  // Clear a route left from a previous click, regardless of where the user clicked.
  if (routeLayer) {
    map.removeLayer(routeLayer);
    routeLayer = null;
  }

  if (userMarker) {
    map.removeLayer(userMarker);
  }

  userMarker = L.marker([lat, lng]).addTo(map);
  panel.style.display = "block";

  // Outside every isodistance polygon: do not call OSRM and do not identify a school.
  if (category === null || !BAND_INFO[category]) {
    panel.innerHTML = `
      <h3>Εκτός περιοχής ανάλυσης</h3>
      <div class="row">
        <span class="label">Accessibility</span>
        <span class="value">Χωρίς κατηγορία απόστασης</span>
      </div>
    `;
    return;
  }

  const categoryLabel = BAND_INFO[category].label;
  panel.innerHTML = `<div id="loading">Υπολογισμός απόστασης…</div>`;

  try {
    const nearest = await findNearestSchoolByRoad(lat, lng);
    const cost = fuelCost(nearest.distKm);

    routeLayer = L.geoJSON(nearest.geojson, {
      style: {
        color: "#27ae60",
        weight: 4,
        opacity: 0.85
      }
    }).addTo(map);

    panel.innerHTML = `
      <h3>${nearest.name}</h3>

      <div class="row">
        <span class="label">Απόσταση</span>
        <span class="value">${nearest.distKm.toFixed(1)} χλμ</span>
      </div>

      <div class="row">
        <span class="label">Ζώνη απόστασης</span>
        <span class="value">${categoryLabel}</span>
      </div>
    `;
  } catch (error) {
    console.error(error);

    panel.innerHTML = `
      <h3>Accessibility classification</h3>

      <div class="row">
        <span class="label">Zone</span>
        <span class="value">${categoryLabel}</span>
      </div>

      <div class="row">
        <span class="label">Routing</span>
        <span class="value">No route found</span>
      </div>
    `;
  }
});

  document.getElementById("map-switch").addEventListener("click", () => {
  activeMapKey = activeMapKey === "lykeia" ? "gymnasia" : "lykeia";

  document.getElementById("map-switch").textContent =
    activeMapKey === "lykeia"
      ? "Χάρτης Γυμνασίων"
      : "Χάρτης Λυκείων";

  loadMapData(activeMapKey);
});

</script>
</body>
</html>
