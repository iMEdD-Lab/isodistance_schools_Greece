
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Greece School Accessibility Map</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"/>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }

  #map {
    width: 100%;
    height: 600px;
  }

  #panel {
    position: absolute;
    top: 10px;
    right: 10px;
    z-index: 1000;
    display: none;
    max-width: 280px;
    padding: 14px 16px;
    background: white;
    border-radius: 8px;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
    font-size: 14px;
  }

  #panel h3 {
    margin: 0 0 8px;
    font-size: 15px;
  }

  #panel .row {
    display: flex;
    justify-content: space-between;
    gap: 14px;
    margin: 4px 0;
  }

  #panel .label {
    color: #666;
  }

  #panel .value {
    font-weight: 600;
    text-align: right;
  }

  #instructions {
    position: absolute;
    top: 10px;
    left: 50px;
    z-index: 1000;
    padding: 8px 14px;
    background: white;
    border-radius: 6px;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
    font-size: 13px;
    color: #444;
  }
</style>
</head>
<body>

<div id="map"></div>
<div id="instructions">Click anywhere in Greece to view its accessibility class</div>
<div id="panel"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Turf.js/6.5.0/turf.min.js"></script>
<script>

// ── Data files ───────────────────────────────────────────────────────────────
const ISODISTANCES_URL =
  "./reproject_50m.geojson";

const LYKEIA_URL =
  "./lykeia_points.geojson";

// The property name in reproject_50m.geojson is expected to be "category".
// Change it here if the GeoJSON uses another name, e.g. "final_category".
const CATEGORY_FIELD = "category";

const BAND_INFO = {
  1: { label: "0–5 km", color: "#2166ac" },
  2: { label: "5–10 km", color: "#74add1" },
  3: { label: "10–25 km", color: "#fdae61" },
  4: { label: "25–50+ km or unreachable", color: "#d73027" }
};

const SCHOOL_COLOR = "#5b2c6f";

let DATA = {
  isodistances: null,
  lykeia: null
};

// ── Map setup ───────────────────────────────────────────────────────────────
const map = L.map("map").setView([38.0, 23.7], 8);

L.tileLayer("https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png", {
  attribution: "&copy; OpenStreetMap &copy; CARTO"
}).addTo(map);

let userMarker = null;

// ── Data loading ────────────────────────────────────────────────────────────
Promise.all([
  fetch(ISODISTANCES_URL).then(response => {
    if (!response.ok) {
      throw new Error(`Could not load isodistance GeoJSON (HTTP ${response.status}).`);
    }
    return response.json();
  }),
  fetch(LYKEIA_URL).then(response => {
    if (!response.ok) {
      throw new Error(`Could not load Lykeia GeoJSON (HTTP ${response.status}).`);
    }
    return response.json();
  })
])
.then(([isodistances, lykeia]) => {
  DATA.isodistances = isodistances;
  DATA.lykeia = lykeia;

  renderBands();
  renderLykeia();
})
.catch(error => {
  document.getElementById("instructions").textContent =
    "Failed to load map data. Open the browser console for details.";
  console.error(error);
});

// ── Isodistance polygons ────────────────────────────────────────────────────
function renderBands() {
  L.geoJSON(DATA.isodistances, {
    style: feature => {
      const category = Number(feature.properties?.[CATEGORY_FIELD]);
      const info = BAND_INFO[category] || {
        color: "#999",
        label: "Unknown category"
      };

      return {
        color: info.color,
        weight: 1,
        fillColor: info.color,
        fillOpacity: 0.35
      };
    },

    onEachFeature: (feature, layer) => {
      const category = Number(feature.properties?.[CATEGORY_FIELD]);
      const info = BAND_INFO[category];

      if (info) {
        layer.bindTooltip(info.label, { sticky: true });
      }
    }
  }).addTo(map);
}

// ── Lykeia point layer ──────────────────────────────────────────────────────
function renderLykeia() {
  L.geoJSON(DATA.lykeia, {
    pointToLayer: (feature, latlng) => L.circleMarker(latlng, {
      radius: 5,
      color: "white",
      weight: 1.5,
      fillColor: SCHOOL_COLOR,
      fillOpacity: 1
    }),

    onEachFeature: (feature, layer) => {
      const properties = feature.properties || {};

      // This tries several common field names. If your GeoJSON has a known
      // school-name column, replace this whole block with that exact field.
      const schoolName =
        properties.name ||
        properties.NAME ||
        properties.school_name ||
        properties.SCHOOL_NAME ||
        properties.onoma ||
        properties.ΟΝΟΜΑ ||
        "Lykeio";

      layer.bindTooltip(schoolName, { sticky: true });
    }
  }).addTo(map);
}

// ── Local point-in-polygon category lookup ──────────────────────────────────
function getCategoryForPoint(lat, lon) {
  const point = turf.point([lon, lat]);

  for (const feature of DATA.isodistances.features) {
    if (turf.booleanPointInPolygon(point, feature)) {
      return Number(feature.properties?.[CATEGORY_FIELD]);
    }
  }

  return null;
}

// ── Map click handler ───────────────────────────────────────────────────────
map.on("click", event => {
  if (!DATA.isodistances) return;

  const { lat, lng } = event.latlng;
  const panel = document.getElementById("panel");
  const category = getCategoryForPoint(lat, lng);
  const info = BAND_INFO[category];

  if (userMarker) {
    map.removeLayer(userMarker);
  }

  userMarker = L.marker([lat, lng]).addTo(map);

  panel.style.display = "block";
  panel.innerHTML = `
    <h3>Accessibility classification</h3>
    <div class="row">
      <span class="label">Zone</span>
      <span class="value">${info ? info.label : "Outside mapped area"}</span>
    </div>
    <div class="row">
      <span class="label">Coordinates</span>
      <span class="value">${lat.toFixed(4)}, ${lng.toFixed(4)}</span>
    </div>
  `;
});

</script>
</body>
</html>
